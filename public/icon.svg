
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1d6a40"/>
      <stop offset="65%" stop-color="#0a3d28"/>
      <stop offset="100%" stop-color="#06231a"/>
    </radialGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- ===== Silhouette group (man + golf club, all same dark color) ===== -->
  <!-- Order matters: shaft drawn first so head/torso visually cover the part that passes behind. -->
  <g fill="#0a1a12" opacity="0.92">

    <!-- Driver shaft: from right hand at lower-right diagonally up-left, passing behind the head -->
    <line x1="340" y1="395" x2="105" y2="140"
          stroke="#0a1a12" stroke-width="13" stroke-linecap="round"/>

    <!-- Driver clubhead (silhouette, large rounded teardrop characteristic of a driver) -->
    <g transform="translate(78 118) rotate(48)">
      <!-- main bulb -->
      <ellipse cx="0" cy="0" rx="58" ry="38"/>
      <!-- small heel extension for that driver-like rounded heel -->
      <circle cx="-40" cy="6" r="20"/>
    </g>

    <!-- shoulders / torso (covers the lower portion of the shaft) -->
    <path d="M 96 512
             L 96 430
             C 96 360, 175 320, 256 320
             C 337 320, 416 360, 416 430
             L 416 512 Z"/>

    <!-- neck -->
    <rect x="232" y="280" width="48" height="55" rx="8"/>

    <!-- head: drawn AFTER shaft so the shaft appears to pass BEHIND the head -->
    <ellipse cx="256" cy="240" rx="76" ry="86"/>

    <!-- cap crown -->
    <path d="M 178 218
             C 178 162, 215 138, 256 138
             C 297 138, 334 162, 334 218
             L 334 232
             C 310 220, 280 214, 256 214
             C 232 214, 202 220, 178 232 Z"/>

    <!-- cap brim -->
    <path d="M 150 232
             C 175 218, 220 214, 256 214
             C 282 214, 305 218, 325 226
             L 360 232
             C 365 246, 358 256, 340 258
             L 175 258
             C 158 258, 148 246, 150 232 Z"/>

    <!-- right hand gripping the shaft at the right shoulder -->
    <ellipse cx="340" cy="392" rx="26" ry="16" transform="rotate(-45 340 392)"/>

  </g>

  <!-- "へらけん" small white label inside the driver clubhead silhouette -->
  <g transform="translate(75 118) rotate(48)">
    <text x="0" y="5"
          font-family="WenQuanYi Zen Hei, Unifont-JP, sans-serif"
          font-size="20" font-weight="700"
          fill="#ffffff" text-anchor="middle"
          letter-spacing="-0.5">へらけん</text>
  </g>

  <!-- ===== White text: 壁ゴルフ / 距離計 + compass ===== -->
  <g font-family="WenQuanYi Zen Hei, Unifont-JP, sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">
    <text x="256" y="402" font-size="78" letter-spacing="-2">壁ゴルフ</text>
    <text x="206" y="478" font-size="60" letter-spacing="-1">距離計</text>
  </g>

  <!-- ===== Compass icon (drawn as paths, to the right of "距離計") ===== -->
  <g transform="translate(338 458)">
    <circle cx="0" cy="0" r="32" fill="#d8a23a" stroke="#0a1a12" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="#fdf6e3" stroke="#a8861f" stroke-width="2"/>
    <path d="M 0 -20 L 8 0 L 0 4 L -8 0 Z" fill="#e95d5d"/>
    <path d="M 0 20 L 8 0 L 0 -4 L -8 0 Z" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>
    <text x="0" y="-15" font-size="11" font-family="sans-serif" font-weight="900" fill="#1a1a1a" text-anchor="middle">N</text>
  </g>
</svg>