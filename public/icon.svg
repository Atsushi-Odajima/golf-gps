
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1d6a40"/>
      <stop offset="65%" stop-color="#0a3d28"/>
      <stop offset="100%" stop-color="#06231a"/>
    </radialGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- ===== Silhouette group (man holding a driver club, all same dark color) ===== -->
  <g fill="#0a1a12" stroke="#0a1a12" opacity="0.92">

    <!-- Driver shaft -->
    <line x1="372" y1="180" x2="110" y2="190"
          stroke-width="14" stroke-linecap="round"/>

    <!-- Driver clubhead -->
    <g transform="translate(85 195) rotate(-8)">
      <ellipse cx="0" cy="0" rx="64" ry="42"/>
      <circle cx="-42" cy="6" r="24"/>
    </g>

    <!-- Body silhouette -->
    <path d="M 96 512
             L 96 430
             C 96 360, 175 320, 256 320
             C 337 320, 416 360, 416 430
             L 416 512 Z" stroke="none"/>
    <rect x="232" y="280" width="48" height="55" rx="8" stroke="none"/>
    <ellipse cx="256" cy="240" rx="76" ry="86" stroke="none"/>
    <path d="M 178 218
             C 178 162, 215 138, 256 138
             C 297 138, 334 162, 334 218
             L 334 232
             C 310 220, 280 214, 256 214
             C 232 214, 202 220, 178 232 Z" stroke="none"/>
    <path d="M 150 232
             C 175 218, 220 214, 256 214
             C 282 214, 305 218, 325 226
             L 360 232
             C 365 246, 358 256, 340 258
             L 175 258
             C 158 258, 148 246, 150 232 Z" stroke="none"/>

    <!-- Right arm raised -->
    <line x1="378" y1="335" x2="438" y2="252"
          stroke-width="46" stroke-linecap="round"/>
    <line x1="438" y1="252" x2="378" y2="180"
          stroke-width="40" stroke-linecap="round"/>
    <ellipse cx="376" cy="180" rx="28" ry="22" stroke="none"/>

  </g>

  <!-- "へらけん" label inside clubhead -->
  <g transform="translate(82 196) rotate(-8)">
    <text x="0" y="6"
          font-family="Meiryo, メイリオ, 'Hiragino Sans', 'ヒラギノ角ゴシック', 'Noto Sans JP', IPAPGothic, IPAGothic, 'WenQuanYi Zen Hei', sans-serif"
          font-size="22" font-weight="700"
          fill="#ffffff" text-anchor="middle"
          letter-spacing="-0.5">へらけん</text>
  </g>

  <!-- ===== Single-line app name: 壁の距離計 + compass (raised, tight spacing) ===== -->
  <g font-family="Meiryo, メイリオ, 'Hiragino Sans', 'ヒラギノ角ゴシック', 'Noto Sans JP', IPAPGothic, IPAGothic, 'WenQuanYi Zen Hei', sans-serif" font-weight="900" fill="#ffffff" text-anchor="middle">
    <text x="210" y="395" font-size="60" letter-spacing="-1">壁の距離計</text>
  </g>

  <!-- Compass icon (= 🧭) right against the text -->
  <g transform="translate(378 378)">
    <circle cx="0" cy="0" r="28" fill="#d8a23a" stroke="#0a1a12" stroke-width="3"/>
    <circle cx="0" cy="0" r="22" fill="#fdf6e3" stroke="#a8861f" stroke-width="2"/>
    <path d="M 0 -18 L 7 0 L 0 4 L -7 0 Z" fill="#e95d5d"/>
    <path d="M 0 18 L 7 0 L 0 -4 L -7 0 Z" fill="#1a1a1a"/>
    <circle cx="0" cy="0" r="3" fill="#1a1a1a"/>
    <text x="0" y="-13" font-size="10" font-family="sans-serif" font-weight="900" fill="#1a1a1a" text-anchor="middle">N</text>
  </g>
</svg>